# Render blueprint for the CampusSage API (free web service, light requirements).
services:
  - type: web
    name: campussage-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENAI_API_KEY
        sync: false          # set the value in the Render dashboard, never in this file
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: VECTOR_BACKEND
        value: tfidf
      - key: CORS_ORIGINS
        sync: false          # e.g. https://campussage.vercel.app
